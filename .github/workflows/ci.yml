name: CI

on:
  # Only main on push. A branch with an open pull request is already covered by the
  # pull_request trigger, and listening to both ran the whole matrix twice for every
  # commit on a branch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin header declares "Requires PHP: 7.4", so the floor is checked too.
        # No Composer here on purpose: the dev tools need a newer PHP than the plugin
        # itself does, and php -l needs nothing installed.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      # Same script `composer run lint` uses, so local and CI cannot drift apart.
      # It needs no dependencies, which is why this job installs none.
      - name: Syntax check every PHP file
        run: php bin/lint.php

  standards:
    name: Coding standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: PHP_CodeSniffer
        run: composer run cs -- --report=full --report-width=120

  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: PHPUnit
        run: composer run test
